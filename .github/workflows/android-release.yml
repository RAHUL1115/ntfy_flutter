name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: /tmp/release-key.keystore
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: release-alias
      ANDROID_SIGNING_SHA256: fb087b126a51647110e4b2a5f7548c4dc60c645e63685ed47e461436d423d9e8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Validate signing key
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Check tag version
        shell: bash
        run: |
          version="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          test "$GITHUB_REF_NAME" = "v${version%%+*}"

      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build apk --release --no-pub

      - name: Verify APK signature
        shell: bash
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          output="$("$apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          printf '%s\n' "$output"
          grep -qi "certificate SHA-256 digest: $ANDROID_SIGNING_SHA256" <<<"$output"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ntfy-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "build/app/outputs/flutter-apk/app-release.apk#ntfy-${GITHUB_REF_NAME}.apk"
          --verify-tag --generate-notes
